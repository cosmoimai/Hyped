spring:
  application:
    name: hyped-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hyped}
    username: ${DATABASE_USERNAME:hyped}
    password: ${DATABASE_PASSWORD:hyped}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:5}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:0}
      connection-timeout: 5000
  flyway:
    enabled: true
    create-schemas: true
    default-schema: flyway
    schemas: flyway,app,ops,analytics
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

hyped:
  firebase:
    enabled: ${FIREBASE_IDENTITY_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    clock-skew: ${FIREBASE_IDENTITY_CLOCK_SKEW:60s}
  tokens:
    enabled: ${TOKEN_SIGNING_ENABLED:false}
    issuer: ${TOKEN_ISSUER:}
    audience: ${TOKEN_AUDIENCE:}
    key-id: ${TOKEN_KEY_ID:}
    public-key: ${TOKEN_RSA_PUBLIC_KEY:}
    private-key: ${TOKEN_RSA_PRIVATE_KEY:}
    access-token-lifetime: ${ACCESS_TOKEN_LIFETIME:1h}
    refresh-token-lifetime: ${REFRESH_TOKEN_LIFETIME:30d}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: Hyped! Backend
    version: "@project.version@"
