<!-- Toast Feedback Affordance -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-inverse-surface text-inverse-on-surface font-label-md text-label-md opacity-0 pointer-events-none transition-all duration-300 shadow-lg flex items-center gap-2" id="toastMessage">
<span class="material-symbols-outlined text-secondary-container text-[18px]">check_circle</span>

</div>

<script>
  (function() {
    let secondsLeft = 45;
    const secsEl = document.getElementById('cd-secs');
    
    // Smooth countdown ticker micro-interaction
    setInterval(() => {
      if (secondsLeft > 0) {
        secondsLeft -= 1;
      } else {
        secondsLeft = 59;
      }
      if (secsEl) {
        secsEl.textContent = String(secondsLeft).padStart(2, '0');
      }
    }, 1000);

    // Modal Sheet Handlers
    const moreBtn = document.getElementById('moreActionsBtn');
    const membersBtn = document.getElementById('membersPillBtn');
    const modal = document.getElementById('actionModal');
    const modalPanel = document.getElementById('actionModalPanel');
    const closeBtn = document.getElementById('closeModalBtn');

    function openModal() {
      if (modal && modalPanel) {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        modal.classList.add('opacity-100', 'pointer-events-auto');
        modalPanel.classList.remove('translate-y-full');
      }
    }

    function closeModal() {
      if (modal && modalPanel) {
        modalPanel.classList.add('translate-y-full');
        modal.classList.remove('opacity-100', 'pointer-events-auto');
        modal.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    if (moreBtn) moreBtn.addEventListener('click', openModal);
    if (membersBtn) membersBtn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });
    }

    // Audio ambient mute toggle
    const musicToggle = document.getElementById('musicToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    let soundOn = true;
    if (musicToggle && soundIcon) {
      musicToggle.addEventListener('click', () => {
        soundOn = !soundOn;
        soundIcon.textContent = soundOn ? 'volume_up' : 'volume_off';
        showToast(soundOn ? 'Ambient waves audio turned on' : 'Ambient sound muted');
      });
    }

    // Toast triggers
    const toast = document.getElementById('toastMessage');
    const toastText = document.getElementById('toastText');
    let toastTimeout = null;

    function showToast(text) {
      if (!toast || !toastText) return;
      clearTimeout(toastTimeout);
      toastText.textContent = text;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 2400);
    }

    const shareBtn = document.getElementById('shareInviteBtn');
    const reminderBtn = document.getElementById('reminderBtn');

    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        showToast('Invite link copied! Share with friends');
      });
    }

    if (reminderBtn) {
      reminderBtn.addEventListener('click', () => {
        showToast('Calendar reminder created for Goa trip');
      });
    }
  })();
</script></main></body></html>
